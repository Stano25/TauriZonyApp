[package]
name = "zony-app"
version = "1.0.5"
description = "Analýza mobilného pokrytia – generovanie zón, bodov a protokolov z CSV meraní (GSM/LTE/5G)"
authors = ["Stanislav Vysočan"]
edition = "2021"

[lib]
name = "zony_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
dirs = "6.0.0"
csv = "1.3"
tokio = "1.54.1"
regex = "1.12.2"
umya-spreadsheet = "2.3.3"
calamine = "0.38.0"
geo = "0.32.0"

# Profil pre finálny build: maximálna rýchlosť behu + menšia binárka
[profile.release]
codegen-units = 1   # jedna optimalizačná jednotka – lepší prierez optimalizácie
lto = true          # Link Time Optimization – výrazne rýchlejší kód, pomalšie linkovanie
opt-level = 3       # maximálna optimalizácia rýchlosti
strip = true        # odstránenie debug symbolov – menšia binárka
panic = "abort"     # odstránenie unwind pri panike – menší a rýchlejší kód
debug = false       # bez debug informácií – menšia binárka
rpath = false       # bez rpath – menšia binárka

# Profil pre vývoj: rýchla opakovaná kompilácia
[profile.dev]
incremental = true
