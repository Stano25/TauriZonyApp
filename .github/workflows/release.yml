name: Release Build

# Build pre Windows + vytvorenie GitHub release pri pushnutí tagu (napr. v1.0.3)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Windows exe (Tauri)
        run: bun run tauri build --no-bundle

      - name: Prepare exe for release
        shell: pwsh
        run: Copy-Item src-tauri/target/release/zony-app.exe zony-app.exe

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag zony-app.exe --title "Zony App $tag" --notes "Protokol DB: pridana moznost vyberu rezimu SA / NSA pre vyhodnotenie 5G zon (NSA = povodna kotva LTE, SA = len podla 5G signalu)." --latest=true
